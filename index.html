<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI FNF Mod Maker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🤖 AI FNF Mod Maker</h1>
  <p>Psych Engine 1.0.4 • GitHub Pages • client-side</p>
</header>

<main>
<section class="card">
<h2>1. Project</h2>
<div class="grid">
<label>Mod name<input id="modName" value="AI Madness"></label>
<label>Song name<input id="songName" value="ai-madness"></label>
<label>BPM<input id="bpm" type="number" value="180" min="30" max="500"></label>
<label>Length (seconds)<input id="length" type="number" value="90" min="10" max="600"></label>
</div>
<label>Song prompt<textarea id="prompt">fast chaotic FNF song with an energetic electronic feel, simple intro, dense chorus, and a big ending</textarea></label>
</section>

<section class="card">
<h2>2. AI connection</h2>
<p class="muted">Paste your API key locally. It is kept in this browser and is never put into the exported mod.</p>
<input id="apiKey" type="password" placeholder="API key">
<div class="row">
<button id="saveKey">Save locally</button>
<button id="testKey" class="secondary">Test connection</button>
</div>
<div id="aiStatus" class="status">Not tested</div>
</section>

<section class="card">
<h2>3. SF2 / SF3 SoundFont</h2>
<input id="sf2" type="file" accept=".sf2,.sf3,audio/sf2,audio/x-soundfont">
<div id="sfStatus" class="status">No SoundFont loaded</div>
<div class="grid">
<label>Preset<select id="preset"><option value="">Load an SF2 first</option></select></label>
<label>Preview note<select id="previewNote"></select></label>
</div>
<div class="row">
<button id="testNote" class="secondary">Test note</button>
<button id="generate">Generate song</button>
</div>
</section>

<section class="card">
<h2>4. Psych Engine output</h2>
<div class="grid">
<label>Difficulty<select id="difficulty"><option>Easy</option><option>Normal</option><option selected>Hard</option></select></label>
<label>Character<input id="player" value="bf"></label>
<label>Opponent<input id="opponent" value="dad"></label>
<label>Stage<input id="stage" value="stage"></label>
</div>
<div class="row">
<button id="export" disabled>Export Psych Engine ZIP</button>
<button id="previewJson" class="secondary" disabled>Preview chart JSON</button>
</div>
<pre id="log">Ready.</pre>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
